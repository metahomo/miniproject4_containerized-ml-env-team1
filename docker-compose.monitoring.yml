# 숨통 모니터링 — Prometheus(수집) + Grafana(대시보드). docker-compose.yml 과 함께 쓴다.
#   받는 쪽:  docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   개발 쪽:  docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.monitoring.yml up -d --build
# 준비: 이 폴더의 .env 에 GRAFANA_ADMIN_PASSWORD=<비밀번호> (.env 는 git 에 올라가지 않는다)
# 화면: Prometheus http://localhost:9090 · Grafana http://localhost:3000 (admin / 위 비밀번호)
# 두 화면 모두 이 PC 에서만 열린다(127.0.0.1). 다른 PC 에서 보려면 포트 앞의 127.0.0.1: 를 지운다.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d                      # 지표는 7일 보관
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:${PROM_PORT:-9090}:9090"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env 에 GRAFANA_ADMIN_PASSWORD 를 넣으세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
