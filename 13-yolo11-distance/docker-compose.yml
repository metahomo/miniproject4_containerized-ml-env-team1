name: yolo11-cv-service

services:
  yolo11-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: yolo11-bus-distance:v1.3
    environment:
      - CV_MODELS_DIR=/app/backend/models
      - APP_VERSION=v1.3
    volumes:
      # 호스트의 모델 및 샘플 이미지 폴더 (읽기 전용 마운트)
      - ../backend/models:/app/backend/models:ro
      - ../backend/samples:/app/backend/samples:ro
      # 작업 데이터셋 및 결과물 저장 폴더
      - ./data:/app/data
      - ./datasets:/app/datasets
      - ./results:/app/results
    stdin_open: true
    tty: true
    # ------------------------------------------------------------------
    # [GPU 전환 시 아래 image 태그 및 deploy 블록 주석 해제]
    # ------------------------------------------------------------------
